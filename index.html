<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Commodity Verdict</title><style>:root{color-scheme:dark;--bg:#0b0f14;--text:#e6edf3;--muted:#9fb0c3;--line:#26313d;--ok:#2fe67a;--warn:#ffd24a;--bad:#ff5c7a}*{box-sizing:border-box}body{margin:0;font-family:system-ui,Segoe UI,Roboto,Arial;background:var(--bg);color:var(--text);padding:24px}.wrap{max-width:1000px;margin:auto}header{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}h1{margin:0;font-size:22px}.sub{color:var(--muted);font-size:13px}.panel{border:1px solid var(--line);border-radius:16px;margin-top:14px;overflow:hidden}.hd{padding:12px 14px;border-bottom:1px solid var(--line);font-weight:800}.bd{padding:14px}.filters{display:flex;gap:8px;flex-wrap:wrap}button,select,input{border:1px solid var(--line);background:#111820;color:var(--text);padding:9px 12px;border-radius:10px;font-weight:700}button{cursor:pointer}.filter.active{outline:1px solid var(--text)}table{width:100%;border-collapse:collapse;font-size:12px;margin-top:12px}th,td{padding:9px 7px;border-bottom:1px solid var(--line);text-align:left}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}.BUY{background:var(--ok)}.SELL{background:var(--bad)}.HOLD,.NOT_RECOMMEND{background:var(--warn)}.error{color:var(--bad)}.live{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.live input{min-width:180px}</style><script src="assets/verdict-engine.js"></script></head><body><div class="wrap"><header><div><h1>Commodity Verdict</h1><div class="sub" id="status">Loading verdict.csv…</div></div><button id="reload">Reload</button></header><section class="panel"><div class="hd">Production records</div><div class="bd"><div class="filters" id="filters"></div><div class="live"><select id="commodity"></select><input id="ltp" inputmode="decimal" placeholder="Live LTP override (optional)"><button id="calc">Validate live override</button></div><div class="sub" id="liveMsg">Loading published repository state…</div><div style="overflow:auto"><table><thead><tr><th>Date</th><th>Record</th><th>Instrument</th><th>LTP</th><th>Verdict</th><th>Conf.</th><th>Entry</th><th>Invalidation</th></tr></thead><tbody id="rows"></tbody></table></div></div></section></div><script>
const CV=CommodityVerdict,commodities=["GOLD","SILVER","CRUDE","ZINC","COPPER"];let records=[],filter="ALL";function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}function exactRecord(c){return records.filter(r=>CV.commodityKey(r.instrument)===c).sort((a,b)=>String(b.date).localeCompare(String(a.date)))[0]||null;}function showPublishedState(){const c=document.getElementById("commodity").value,exact=exactRecord(c),msg=document.getElementById("liveMsg");if(!exact){msg.textContent=`No ${c} row. No cross-instrument fallback permitted.`;return;}msg.textContent=`${c}: ${exact.verdict} • ${Math.round(Number(exact.confidence_score_percent)||0)}% • published repository state @ LTP ${exact.ltp||"—"}`;}function render(){const shown=records.filter(r=>filter==="ALL"||CV.commodityKey(r.instrument)===filter);document.getElementById("rows").innerHTML=shown.map(r=>`<tr><td>${esc(r.date)}</td><td>${esc(r.record_id)}</td><td>${esc(r.instrument)}</td><td>${esc(r.ltp||"—")}</td><td><span class="dot ${esc(r.verdict)}"></span>${esc(r.verdict)}</td><td>${esc(r.confidence_score_percent)}%</td><td>${esc(r.entry_zone||"—")}</td><td>${esc(r.invalid_if_above||"—")}</td></tr>`).join("");}async function load(){try{const res=await fetch("verdict.csv",{cache:"no-store"});if(!res.ok)throw Error(`HTTP ${res.status}`);records=CV.parseVerdictCsv(await res.text());const found=new Set(records.map(r=>CV.commodityKey(r.instrument))),missing=commodities.filter(c=>!found.has(c));if(missing.length)throw Error(`missing commodities: ${missing.join(", ")}`);document.getElementById("status").textContent=`verdict.csv • ${records.length} rows • ${new Date().toLocaleString()}`;render();showPublishedState();}catch(e){records=[];render();document.getElementById("status").innerHTML=`<span class="error">Fail closed: ${esc(e.message)}</span>`;document.getElementById("liveMsg").textContent="Published state unavailable.";}}const f=document.getElementById("filters");["ALL",...commodities].forEach(c=>{const b=document.createElement("button");b.textContent=c;b.className="filter"+(c==="ALL"?" active":"");b.onclick=()=>{filter=c;[...f.children].forEach(x=>x.classList.toggle("active",x===b));render()};f.appendChild(b);});const sel=document.getElementById("commodity"),ltp=document.getElementById("ltp");commodities.forEach(c=>sel.add(new Option(c,c)));sel.onchange=()=>{ltp.value="";showPublishedState();};document.getElementById("calc").onclick=()=>{const exact=exactRecord(sel.value),msg=document.getElementById("liveMsg");if(!exact){msg.textContent=`No ${sel.value} row. No cross-instrument fallback permitted.`;return;}const raw=ltp.value.trim();if(!raw){showPublishedState();return;}const out=CV.computeLiveUpdate(exact,raw);msg.textContent=`${sel.value}: ${out.verdict} • ${Math.round(out.confidence)}% • ${out.reason} • live override ${raw}`;};document.getElementById("reload").onclick=()=>{ltp.value="";load();};load();
</script></body></html>
