name: Generate Commodity Verdict
on:
  push:
    branches: [main, feat/multi-source-verification]
    paths:
      - 'backend/**'
      - 'tests/**'
      - 'assets/**'
      - 'index.html'
      - '.github/workflows/generate-verdict.yml'
  schedule:
    - cron: "15 3 * * 1-5" # 08:45 IST EOD level freeze
    - cron: "35,50 3 * * 1-5" # 09:05, 09:20 IST
    - cron: "5,20,35,50 4-17 * * 1-5" # 09:35 through 23:20 IST
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: commodity-verdict-${{ github.ref_name }}
  cancel-in-progress: true
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MCX_LOOKBACK_DAYS: '8'
      MAX_SOURCE_AGE_MINUTES: '10080'
      MAX_CURRENT_PRICE_AGE_MINUTES: '30'
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - name: Python tests
        run: python3 -m unittest discover -s tests/python -p 'test_*.py'
      - name: JavaScript and CSV-contract tests
        run: node --test tests/js/*.test.js
      - name: Acquire governed current-session prices when market is open
        run: |
          HM="$(TZ=Asia/Kolkata date +%H%M)"
          DOW="$(TZ=Asia/Kolkata date +%u)"
          HM_NUM=$((10#$HM))
          if [ "$DOW" -le 5 ] && [ "$HM_NUM" -ge 900 ] && [ "$HM_NUM" -le 2330 ]; then
            python3 backend/acquire_current_prices.py /tmp/current-prices.json /tmp/eod-verified.json
            echo "EOD_VERIFIED_SOURCE_PATH=/tmp/eod-verified.json" >> "$GITHUB_ENV"
            echo "CURRENT_PRICE_SOURCE_PATH=/tmp/current-prices.json" >> "$GITHUB_ENV"
            echo "REQUIRE_CURRENT_SESSION_OBSERVATION=1" >> "$GITHUB_ENV"
            echo "current-session mode enabled at ${HM} IST"
          else
            echo "current-session mode disabled at ${HM} IST; freezing EOD levels only"
          fi
      - name: Generate through repository two-state engine
        run: python3 backend/generate_verdict.py
      - name: Verify generated contract and two-state invariants
        run: |
          python3 - <<'PY'
          import csv, json
          from pathlib import Path
          expected="record_id,date,ltp,capital_inr,market,instrument,mode,verdict,confidence_score_percent,entry_zone,invalid_if_above,risk_per_trade_inr,daily_loss_cap_inr".split(",")
          rows=list(csv.DictReader(Path("verdict.csv").open()))
          assert rows and list(rows[0].keys()) == expected
          assert len(rows)==5
          assert {r["instrument"].split()[0].upper() for r in rows} == {"GOLD","SILVER","CRUDE","ZINC","COPPER"}
          audit=json.loads(Path("verdict.audit.json").read_text())
          assert audit["adapter"]["adapter"] == "mcx-multi-source-v1"
          assert 0 <= int(audit["adapter"]["verified_count"]) <= 5
          assert audit.get("schema_version") == "commodity-verdict-audit-v2"
          assert audit.get("engine_state_model") == "EOD_LEVEL_FREEZE_THEN_CURRENT_SESSION_EVALUATION"
          current_count=int(audit.get("current_observation_count",0))
          require_current=bool(audit.get("require_current_session_observation",False))
          actionable=sum(r["verdict"] in {"BUY","SELL"} for r in rows)
          if current_count == 0 and actionable != 0:
              raise SystemExit("publication blocked: actionable verdict without current-session observation")
          if current_count > 0 and not audit.get("current_price_source"):
              raise SystemExit("publication blocked: current-session observations lack explicit source path")
          if require_current:
              if not audit.get("eod_snapshot_source"):
                  raise SystemExit("publication blocked: post-open engine did not reuse governed EOD snapshot")
              diag=audit.get("current_price_diagnostics") or {}
              if diag.get("adapter") != "mcx-current-session-mirrors-v1":
                  raise SystemExit("publication blocked: post-open run lacks governed current-price diagnostics")
              bad=[r["instrument"].split()[0].upper() for r in rows if not r["ltp"] and r["verdict"]!="NOT_RECOMMEND"]
              if bad: raise SystemExit(f"publication blocked: missing post-open prices not fail-closed: {bad}")
          print(f"two-state gate: require_current={require_current}, current_observations={current_count}, actionable={actionable}")
          PY
      - name: Require current IST verdict date before publication
        if: github.ref_name == 'main'
        run: |
          EXPECTED_DATE="$(TZ=Asia/Kolkata date +%F)"
          EXPECTED_DATE="$EXPECTED_DATE" python3 - <<'PY'
          import csv, os
          from pathlib import Path
          expected=os.environ["EXPECTED_DATE"]
          rows=list(csv.DictReader(Path("verdict.csv").open()))
          dates={r["date"] for r in rows}
          if dates != {expected}:
              raise SystemExit(f"publication blocked: verdict.csv dates {sorted(dates)} != current IST date {expected}")
          print(f"publication date gate: 5/5 rows dated {expected}")
          PY
      - name: Require all five verified before feature promotion
        if: github.ref_name != 'main'
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("adapter.diagnostics.json").read_text())
          count=int(d.get("verified_count",0))
          if count != 5:
              raise SystemExit(f"promotion blocked: {count}/5 exact contracts cross-source verified")
          bad=[k for k,v in d.get("commodities",{}).items() if v.get("status") not in {"CROSS_SOURCE_VERIFIED","MCX_PLUS_MIRRORS"}]
          if bad:
              raise SystemExit(f"promotion blocked: unverified commodities {bad}")
          print("promotion gate: 5/5 verified")
          PY
      - name: Scan production files for credential patterns
        run: |
          ! grep -RInE '(BEGIN (RSA|OPENSSH) PRIVATE KEY|gh[pousr]_[A-Za-z0-9]{20,}|Authorization:[[:space:]]*(Bearer|Basic)[[:space:]]+[A-Za-z0-9+/=_-]{12,})' backend assets index.html .github verdict.csv verdict.audit.json adapter.diagnostics.json
      - name: Serve site and verify required assets
        run: |
          python3 -m http.server 8000 >/tmp/commodity-http.log 2>&1 &
          pid=$!
          trap 'kill $pid' EXIT
          sleep 1
          curl --fail --silent http://127.0.0.1:8000/index.html >/dev/null
          curl --fail --silent http://127.0.0.1:8000/assets/verdict-engine.js >/dev/null
          curl --fail --silent http://127.0.0.1:8000/verdict.csv >/dev/null
      - name: Publish changed generated outputs to current branch
        run: |
          set -euo pipefail
          generated_dir="$(mktemp -d)"
          trap 'rm -rf "$generated_dir"' EXIT
          cp verdict.csv verdict.audit.json adapter.diagnostics.json "$generated_dir"/

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3; do
            echo "Publish attempt ${attempt}/3: reconcile with origin/${GITHUB_REF_NAME}"
            git fetch origin "$GITHUB_REF_NAME"
            git reset --hard "origin/$GITHUB_REF_NAME"
            cp "$generated_dir/verdict.csv" "$generated_dir/verdict.audit.json" "$generated_dir/adapter.diagnostics.json" .
            git add verdict.csv verdict.audit.json adapter.diagnostics.json

            if git diff --cached --quiet; then
              echo "No generated output changes after reconciliation."
              exit 0
            fi

            git commit -m "chore: update commodity verdict"
            if git push origin HEAD:"$GITHUB_REF_NAME"; then
              echo "Generated outputs published successfully."
              exit 0
            fi

            echo "Branch advanced during publish; retrying from latest tip."
          done

          echo "Failed to publish generated outputs after 3 reconciliation attempts." >&2
          exit 1
